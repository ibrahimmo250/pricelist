<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة إبراهيم</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark brand band, tab bar, one working panel per tab */
:root{
  --bg:#f4f4f6; --surface:#ffffff; --ink:#111114; --muted:#5e5e6a; --line:#e2e2e8;
  --accent:#1860b0; --accent-soft:#e6eef8; --band:#111114;
  --ok:#1d7a46; --ok-bg:#e3f4ea; --warn:#9a3b12; --warn-bg:#fbe9e1; --amber:#8a4b00; --amber-bg:#fff4e2;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e11; --surface:#18181d; --ink:#ececf1; --muted:#9e9eab; --line:#2b2b33; --accent:#7fb2ee; --accent-soft:#1a2738; --band:#000;
  --ok:#7fd6a2; --ok-bg:#16301f; --warn:#f3a283; --warn-bg:#3a2016; --amber:#ffc979; --amber-bg:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e11; --surface:#18181d; --ink:#ececf1; --muted:#9e9eab; --line:#2b2b33; --accent:#7fb2ee; --accent-soft:#1a2738; --band:#000;
  --ok:#7fd6a2; --ok-bg:#16301f; --warn:#f3a283; --warn-bg:#3a2016; --amber:#ffc979; --amber-bg:#33270f; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body)}
.wrap{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.band{background:var(--band);color:#fff;border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.band h1{font:700 20px var(--f-display);margin:0}
.band .sm{font-size:12.5px;opacity:.75}
.band button{border:1px solid #ffffff55;background:none;color:#fff;border-radius:8px;padding:4px 12px;font:inherit;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 16px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.amb{background:var(--amber-bg);color:var(--amber)}.pill.blue{background:var(--accent-soft);color:var(--accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h2{font:700 16px var(--f-display);margin:0 0 10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
td.num,th.num{text-align:left}
td.num{direction:ltr}
.kpi .v{direction:ltr;text-align:right}
td.en{font-family:var(--f-mono);font-size:12.5px;direction:ltr;text-align:right}
tr.tot td{font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools input,.tools select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink);font:15px var(--f-body)}
.tools input{flex:1;min-width:180px}
.btn{border:0;border-radius:8px;background:var(--ink);color:var(--surface);font:600 14px var(--f-body);padding:8px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px 0}
.orders{display:grid;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.order .top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.order .co{font:700 16px var(--f-display)}
.order .meta{font-size:12.5px;color:var(--muted)}
.order .tot{font:700 17px var(--f-display);font-variant-numeric:tabular-nums}
.order details summary{cursor:pointer;font-size:13.5px;color:var(--accent)}
.order select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface);color:var(--ink);font:600 13px var(--f-body)}
.dist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;min-width:0}
.dcard .nm{font:700 16px var(--f-display)}
.pw{display:flex;gap:6px;align-items:center}
.pw code{font:500 14px var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;direction:ltr}
.sw{display:flex;align-items:center;gap:8px;font-size:14px}
.sw input{width:20px;height:20px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.gbox{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;gap:12px;text-align:center}
.gbox h2{font:700 20px var(--f-display);margin:0}
.gbox input{border:1.5px solid var(--line);border-radius:10px;padding:12px;font:500 17px var(--f-body);background:var(--bg);color:var(--ink);text-align:center;direction:ltr}
.gbox button{border:0;border-radius:10px;background:var(--ink);color:var(--surface);font:700 16px var(--f-body);padding:12px;cursor:pointer}
.gerr{color:var(--warn);min-height:1.2em;margin:0}
</style>
</head>
<body>
<div class="gate" id="gate"><form class="gbox" id="gform">
  <h2>لوحة إبراهيم</h2>
  <p style="margin:0;color:var(--muted)">باسورد الأدمن</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="باسورد الأدمن" required>
  <button type="submit" id="gbtn">دخول</button>
  <p class="gerr" id="gerr" aria-live="polite"></p>
</form></div>

<div class="wrap" id="app" hidden>
  <div class="band"><div><h1>لوحة إبراهيم</h1><div class="sm">دليل أسعار فيليبس وإيكولينك · للاستخدام الداخلي</div></div><button type="button" id="logout">خروج</button></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-t="orders" aria-selected="true">الطلبات</button>
    <button class="tab" role="tab" data-t="sales" aria-selected="false">التارجت والمبيعات</button>
    <button class="tab" role="tab" data-t="prices" aria-selected="false">الأسعار الداخلية</button>
    <button class="tab" role="tab" data-t="dist" aria-selected="false">الموزعين</button>
  </div>

  <section id="t-orders">
    <div class="kpis" id="okpis"></div>
    <div class="tools">
      <select id="ofil" aria-label="الموزع"><option value="">كل الموزعين</option></select>
      <select id="osta" aria-label="الحالة"><option value="">كل الحالات</option><option>New</option><option>In progress</option><option>Done</option><option>Cancelled</option></select>
      <button class="btn ghost" type="button" id="orefresh">تحديث</button>
    </div>
    <div class="orders" id="olist"></div>
  </section>

  <section id="t-sales" hidden>
    <div class="kpis" id="skpis"></div>
    <div class="panel" style="margin-bottom:12px"><h2>الأرباع</h2><div class="scroll"><table id="qtab"></table></div></div>
    <div class="panel"><h2>مبيعات الحسابات شهر بشهر (يورو)</h2><div class="scroll"><table id="mtab"></table></div><p class="note" id="snote"></p></div>
  </section>

  <section id="t-prices" hidden>
    <div class="tools"><input id="pq" type="text" placeholder="ابحث بالاسم أو الكود…" aria-label="بحث"><span class="note" id="pcount" style="margin:0"></span></div>
    <div class="panel"><div class="scroll"><table id="ptab"></table></div><p class="note" id="pnote"></p></div>
  </section>

  <section id="t-dist" hidden>
    <div class="dist" id="dlist"></div>
    <p class="note">الإيقاف بيشتغل أول ما الموزع يفتح الموقع وهو على النت. الباسورد نفسه مش بيتغيّر — لتغييره كلّم Claude يطلّعلك ملف جديد.</p>
  </section>
</div>

async function unlock(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  for(const k of KEYS){try{
    const kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(k.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const inner=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(k.iv)},kek,ub(k.ct))));
    const dk=await crypto.subtle.importKey('raw',ub(inner.k),'AES-GCM',false,['decrypt']);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(BLOB.iv)},dk,ub(BLOB.ct))));
  }catch(e){}}
  return null;
}
async function login(pw,remember){
  const g=document.getElementById('gerr'),b=document.getElementById('gbtn');b.disabled=true;b.textContent='جاري الدخول…';g.textContent='';
  const D=await unlock(pw.trim());b.disabled=false;b.textContent='دخول';
  if(!D){g.textContent='الباسورد غلط.';try{localStorage.removeItem('adm-auth')}catch(e){};return}
  if(remember){try{localStorage.setItem('adm-auth',pw.trim())}catch(e){}}
  document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;start(D);
}
document.getElementById('gform').addEventListener('submit',e=>{e.preventDefault();login(document.getElementById('pw').value,true)});
(()=>{let s=null;try{s=localStorage.getItem('adm-auth')}catch(e){};if(s)login(s,false);else document.getElementById('pw').focus()})();

function start(D){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>Math.round(n).toLocaleString('en-US');
const egp=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const E=n=>'<bdi dir="ltr">€'+eur(n)+'</bdi>';
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
$('#logout').onclick=()=>{try{localStorage.removeItem('adm-auth')}catch(e){};location.reload()};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected',x===t));
  document.querySelectorAll('section[id^="t-"]').forEach(s=>s.hidden=s.id!=='t-'+t.dataset.t);
  if(t.dataset.t==='dist')loadDist();
});

/* ---------- Sales & targets ---------- */
(function(){
  const S=D.sales, T=S.targets, M=S.monthly, acc=Object.keys(M);
  const qsum=q=>acc.reduce((s,a)=>s+M[a].slice(q*3,q*3+3).reduce((x,y)=>x+y,0),0);
  const ach=[S.q1,qsum(1),qsum(2),qsum(3)], FYT=T.reduce((a,b)=>a+b,0), FY=ach.reduce((a,b)=>a+b,0);
  const safe=FYT*0.85, q4left=Math.max(0,T[3]-ach[3]);
  const tile=(l,v,s,p,cls)=>`<div class="kpi"><span class="l">${l}</span><span class="v">${v}</span><div class="bar"><i style="width:${Math.min(100,p)}%;${cls?'background:var(--'+cls+')':''}"></i></div><span class="s">${s}</span></div>`;
  $('#skpis').innerHTML=
    tile('Q4 (لازم 100%)','€'+eur(ach[3]),`من ${E(T[3])} · فاضل <b>${E(q4left)}</b>`,ach[3]/T[3]*100,q4left?'amber':'ok')+
    tile('السنة 2026','€'+eur(FY),`من ${E(FYT)} · ${pct(FY,FYT)}`,FY/FYT*100)+
    tile('حد الأمان 85% للسنة','€'+eur(safe),FY>=safe?'<span class="pill ok">عديته ✓</span> بزيادة '+E(FY-safe):'فاضل '+E(safe-FY),FY/safe*100,FY>=safe?'ok':'amber');
  $('#qtab').innerHTML='<tr><th></th><th class="num">التارجت</th><th class="num">المحقق</th><th class="num">%</th><th class="num">الفرق</th></tr>'+
    T.map((t,i)=>`<tr><td>Q${i+1}</td><td class="num">${eur(t)}</td><td class="num">${eur(ach[i])}</td><td class="num">${pct(ach[i],t)}</td><td class="num">${ach[i]>=t?'<span class="pill ok">+'+eur(ach[i]-t)+'</span>':'<span class="pill warn">−'+eur(t-ach[i])+'</span>'}</td></tr>`).join('')+
    `<tr class="tot"><td>السنة</td><td class="num">${eur(FYT)}</td><td class="num">${eur(FY)}</td><td class="num">${pct(FY,FYT)}</td><td class="num">−${eur(FYT-FY)}</td></tr>`;
  const mn=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  const tot=mn.map((_,i)=>acc.reduce((s,a)=>s+M[a][i],0));
  $('#mtab').innerHTML='<tr><th>الحساب</th>'+mn.map(m=>`<th class="num">${m}</th>`).join('')+'<th class="num">الإجمالي</th></tr>'+
    acc.map(a=>`<tr><td>${esc(a)}</td>${M[a].map(v=>`<td class="num">${v?eur(v):'–'}</td>`).join('')}<td class="num"><b>${eur(M[a].reduce((x,y)=>x+y,0))}</b></td></tr>`).join('')+
    `<tr class="tot"><td>الإجمالي</td>${tot.map(v=>`<td class="num">${v?eur(v):'–'}</td>`).join('')}<td class="num">${eur(tot.reduce((x,y)=>x+y,0))}</td></tr>`;
  $('#snote').textContent=`الداتا لحد ${S.asof}. ${S.q1note}. السالب = مرتجعات.`;
})();

/* ---------- Internal prices ---------- */
(function(){
  const P=D.prices, norm=s=>String(s??'').toLowerCase().replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
  P.forEach(p=>p.h=norm([p.code,p.name,p.ar,p.fam,p.brand].join(' ')));
  function draw(){
    const t=norm($('#pq').value).split(/\s+/).filter(Boolean);
    const L=P.filter(p=>t.every(x=>p.h.includes(x)));
    $('#pcount').textContent=L.length+' منتج';
    $('#ptab').innerHTML='<tr><th>الكود</th><th>المنتج</th><th>الوصف</th><th class="num">شامل الضريبة</th><th class="num">من غير ضريبة</th><th class="num">بعد خصم '+Math.round(D.rate*1000)/10+'%</th><th>التوافر</th><th>المنشأ</th><th>ملاحظات</th></tr>'+
      L.slice(0,80).map(p=>`<tr><td class="en">${p.code}</td><td class="en">${esc(p.name)}</td><td>${esc(p.ar)}</td><td class="num"><b>${egp(p.inc)}</b></td><td class="num">${egp(p.ex)}</td><td class="num">${egp(p.net)}</td><td>${p.avail==='MTS'?'<span class="pill ok">MTS</span>':'<span class="pill amb">MTO</span>'}</td><td>${p.src==='EG'?'مصر':'الصين'}</td><td>${esc(p.succ||'')}</td></tr>`).join('');
    $('#pnote').textContent=L.length>80?'بيظهر أول 80 نتيجة — دقّق البحث.':'الأسعار بالجنيه من قايمة T1. "بعد خصم" = السعر من غير ضريبة × (1 − '+(D.rate*100)+'%).';
  }
  $('#pq').addEventListener('input',draw);draw();
})();

/* ---------- Orders (Google Sheet) ---------- */
let ORD=[];
const STA={'New':['جديد','blue'],'In progress':['جاري التنفيذ','amb'],'Done':['اتنفذ','ok'],'Cancelled':['اتلغى','warn']};
async function api(q,body){
  if(!D.api)throw new Error('noapi');
  const r=body?await fetch(D.api,{method:'POST',body:JSON.stringify(Object.assign({key:D.key},body))}):await fetch(D.api+'?key='+encodeURIComponent(D.key)+'&'+q);
  const j=await r.json();if(!j.ok)throw new Error(j.error||'err');return j;
}
async function loadOrders(){
  $('#olist').innerHTML='<p class="empty">جاري التحميل…</p>';
  try{const j=await api('action=orders');ORD=j.orders.reverse();try{localStorage.setItem('adm-orders',JSON.stringify(ORD))}catch(e){}}
  catch(e){let c=null;try{c=JSON.parse(localStorage.getItem('adm-orders')||'null')}catch(_){}
    if(c)ORD=c;else{$('#olist').innerHTML=`<p class="empty">${e.message==='noapi'?'سجل الطلبات لسه مش متوصّل بالـ Google Sheet.':'مش قادر أوصل للـ Google Sheet دلوقتي. اتأكد من النت واضغط تحديث.'}</p>`;$('#okpis').innerHTML='';return}}
  const cos=[...new Set(ORD.map(o=>o.co))];
  $('#ofil').innerHTML='<option value="">كل الموزعين</option>'+cos.map(c=>`<option>${esc(c)}</option>`).join('');
  drawOrders();
}
function drawOrders(){
  const f=$('#ofil').value,s=$('#osta').value;
  const L=ORD.filter(o=>(!f||o.co===f)&&(!s||o.status===s));
  const now=new Date(),thisM=ORD.filter(o=>{const d=new Date(o.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()&&o.status!=='Cancelled'});
  const open=ORD.filter(o=>o.status==='New'||o.status==='In progress');
  $('#okpis').innerHTML=`<div class="kpi"><span class="l">طلبات الشهر ده</span><span class="v">${thisM.length}</span><span class="s">${egp(thisM.reduce((a,o)=>a+Number(o.total||0),0))} جنيه</span></div>
    <div class="kpi"><span class="l">مفتوحة (جديد + جاري)</span><span class="v">${open.length}</span><span class="s">${egp(open.reduce((a,o)=>a+Number(o.total||0),0))} جنيه</span></div>`;
  $('#olist').innerHTML=L.length?L.map(o=>{let items=[];try{items=JSON.parse(o.items)}catch(e){}
    const st=STA[o.status]||[o.status,'blue'];
    return `<article class="order" data-id="${esc(o.id)}"><div class="top"><div><div class="co">${esc(o.co)}</div><div class="meta">${new Date(o.date).toLocaleString('ar-EG',{dateStyle:'medium',timeStyle:'short'})} · ${esc(o.id)}${o.contact?' · '+esc(o.contact):''}</div></div>
      <div class="tot">${egp(o.total)} ج.م</div>
      <select aria-label="حالة الطلب">${Object.entries(STA).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v[0]}</option>`).join('')}</select></div>
      ${o.note?`<div class="meta">ملاحظات: ${esc(o.note)}</div>`:''}
      <details><summary>${items.length} صنف</summary><div class="scroll"><table><tr><th>الكود</th><th>المنتج</th><th class="num">الكمية</th><th class="num">السعر</th><th class="num">الإجمالي</th></tr>
      ${items.map(i=>`<tr><td class="en">${esc(i.code)}</td><td class="en">${esc(i.name)}</td><td class="num">${i.qty}</td><td class="num">${egp(i.price)}</td><td class="num">${egp(i.price*i.qty)}</td></tr>`).join('')}</table></div></details></article>`}).join('')
    :'<p class="empty">مفيش طلبات.</p>';
}
$('#ofil').onchange=drawOrders;$('#osta').onchange=drawOrders;$('#orefresh').onclick=loadOrders;
$('#olist').addEventListener('change',async e=>{
  const sel=e.target.closest('select');if(!sel)return;const id=sel.closest('.order').dataset.id;
  sel.disabled=true;try{await api('',{action:'setStatus',id,status:sel.value});const o=ORD.find(x=>x.id===id);if(o)o.status=sel.value;drawOrders()}
  catch(err){sel.disabled=false;alertBox('مش قادر أحفظ الحالة. اتأكد من النت وجرّب تاني.')}
});
function alertBox(m){const p=document.createElement('p');p.className='note';p.style.color='var(--warn)';p.textContent=m;$('#olist').prepend(p);setTimeout(()=>p.remove(),4000)}
loadOrders();

/* ---------- Distributors ---------- */
async function loadDist(){
  let live=null;try{live=(await api('action=distributors')).list}catch(e){}
  const act=c=>{const r=live&&live.find(x=>x.co===c);return r?r.active:null};
  $('#dlist').innerHTML=D.dist.map(d=>{const a=act(d.co),n=ORD.filter(o=>o.co===d.co),last=n[0];
    return `<div class="dcard" data-co="${esc(d.co)}"><div class="nm">${esc(d.co)}</div>
      <div class="pw"><code>${esc(d.pw)}</code><button class="btn ghost" type="button" data-copy="${esc(d.pw)}">نسخ</button></div>
      <div class="meta" style="font-size:13px;color:var(--muted)">${n.length} طلب${last?' · آخر طلب '+new Date(last.date).toLocaleDateString('ar-EG'):''}</div>
      ${a===null?'<span class="note" style="margin:0">حالة التفعيل محتاجة نت والـ Google Sheet.</span>':
      `<label class="sw"><input type="checkbox" ${a?'checked':''}> <span>${a?'مفعّل':'موقوف'}</span></label>`}</div>`}).join('');
}
$('#dlist').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(!b)return;
  navigator.clipboard?.writeText(b.dataset.copy).then(()=>{b.textContent='اتنسخ ✓';setTimeout(()=>b.textContent='نسخ',1200)}).catch(()=>{})});
$('#dlist').addEventListener('change',async e=>{const cb=e.target.closest('input[type=checkbox]');if(!cb)return;
  const co=cb.closest('.dcard').dataset.co;cb.disabled=true;
  try{await api('',{action:'setActive',co,active:cb.checked});cb.nextElementSibling.textContent=cb.checked?'مفعّل':'موقوف'}
  catch(err){cb.checked=!cb.checked;cb.nextElementSibling.textContent='مش قادر أحفظ — جرّب تاني'}
  cb.disabled=false;});
}
</script>
